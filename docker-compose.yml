version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: movieapp_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: movie
    volumes:
      - db_data:/var/lib/mysql
    #healthcheck:
    #  test: ["CMD", "mysqladmin" ,"ping","-h","localhost"]
    #  interval: 10s
    #  timeout: 5s
    #  retries: 5

  app:
    build:
      context: .
      args:
        - JAR_FILE=target/*.jar
    image: movieapp:latest
    container_name: movieapp_app
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/movie
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      PROJECT_FILELOCATION: /data/files
      BASE_URL: http://localhost:8080/
    volumes:
      - files_data:/data/files

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: movieapp_phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"

volumes:
  db_data:
  files_data:
